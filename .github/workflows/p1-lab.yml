name: P1 Lab

on:
  pull_request:
    branches: [main]
    paths:
      - "p1/**"

permissions:
  contents: read

jobs:
  pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk time
      - name: Prepare fixtures
        run: |
          python -m pip install Pillow==13.0.0
          python p1/fixtures.py
          python p1/reading.py prepare
      - name: Open JTalk and Sudachi
        run: |
          python -m pip install pyopenjtalk-plus==0.4.1.post7 SudachiPy==0.6.10 SudachiDict-core==20250515
          python p1/reading.py pc
          python p1/reading.py listen p1/out/openjtalk
      - name: NDLOCR-Lite
        if: success() || failure()
        run: |
          python -m pip install ndlocr-lite==2.0.0
          python p1/ocr.py ndl
          python p1/ocr.py score p1/out/ndl-pc.json
          python p1/prepare_models.py
          python p1/ruby_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-pc
          path: |
            p1/out/*.json
            p1/out/openjtalk/
            p1/out/listen/
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: |
          python -m pip install Pillow==13.0.0
          python p1/fixtures.py
          python p1/reading.py prepare
          gradle -p android :app:assembleDebug :app:testDebugUnitTest :ndl:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: p1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
