name: P2.7 TalkBack Lite
on:
  pull_request:
    paths:
      - 'p27/lite/**'
      - '.github/workflows/p27-talkback-lite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: gradle -p p27/lite :app:testDebugUnitTest :app:assembleDebug
      - run: |
          unzip -Z1 p27/lite/app/build/outputs/apk/debug/app-debug.apk > files.txt
          if grep -Ei '(^lib/|\.onnx$|mlkit|parseq|deim)' files.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: p27-talkback-lite
          path: p27/lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
