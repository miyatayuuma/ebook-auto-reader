name: P2.7 TalkBack Probe
on:
  pull_request:
    paths:
      - 'p27/probe/**'
      - '.github/workflows/p27-talkback-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: gradle -p p27/probe :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: p27-talkback-probe
          path: p27/probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
