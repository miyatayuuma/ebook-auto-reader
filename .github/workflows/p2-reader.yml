name: P2 Reader

on:
  pull_request:
    branches: [main, p2/reader-engine]
    paths:
      - "android/**"
      - "p2/**"
      - "p1/fixtures.py"
      - ".github/workflows/p2-reader.yml"
  push:
    branches: [p25/controls]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: |
          python -m pip install Pillow==13.0.0
          python p1/fixtures.py --dense
          python p1/reading.py prepare
          bash -n p2/install-debug.sh
          gradle -p android :reader:testDebugUnitTest :ndl:testDebugUnitTest :app:testDebugUnitTest :reader:lintDebug :reader:assembleDebug
          unzip -Z1 android/reader/build/outputs/apk/debug/reader-debug.apk > apk-files.txt
          grep -Fx 'assets/pages/join-a.png' apk-files.txt
          grep -Fx 'assets/pages/body-dense.png' apk-files.txt
          grep -Fx 'assets/pages/body-bottom.png' apk-files.txt
          grep -Fx 'assets/pages/short-a.png' apk-files.txt
          grep -Fx 'assets/pages/body-narrow.png' apk-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p2-debug
          path: android/reader/build/outputs/apk/debug/reader-debug.apk
          if-no-files-found: error
